- name: configure backend
  hosts: backend
  become: yes
  tasks:
  - name: disable nodejs
    ansible.builtin.package:
      name: nodejs
      state: absent
  - name: enable nodejs
    ansible.builtin.command: " dnf module enable nodejs:20 -y "

  - name: install nodejs
    ansible.builtin.package:
      name: nodejs
      state: present
  - name: set user
    ansible.builtin.user:
      name: expense